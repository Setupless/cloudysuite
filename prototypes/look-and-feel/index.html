<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CloudySuite look and feel</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      #ctl {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 12px;
        font: 13px/1.2 var(--font-sans, system-ui, sans-serif);
        color: var(--foreground, #222);
      }
      #ctl div {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #ctl button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border, #ccc);
        border-radius: 7px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #ctl button.on {
        background: var(--foreground, #222);
        color: var(--background, #fff);
        border-color: transparent;
      }
      #note {
        font: 13px/1.45 var(--font-sans, system-ui, sans-serif);
        color: var(--foreground, #222);
        opacity: 0.8;
        margin: 0 0 12px;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .grid.two {
        grid-template-columns: 1fr 1fr;
      }
      .tile {
        cursor: pointer;
        font: 600 13px var(--font-sans, system-ui, sans-serif);
        color: var(--foreground, #222);
      }
      .tile > p {
        margin: 0 0 6px;
      }
      .stage {
        position: relative;
        aspect-ratio: 1120/700;
        overflow: hidden;
        border-radius: 10px;
        border: 1px solid var(--border, #ccc);
      }
      .frame {
        position: absolute;
        left: 0;
        top: 0;
        width: 1120px;
        height: 700px;
        transform-origin: 0 0;
        overflow: hidden;
      }

      .a {
        height: 100%;
        display: grid;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.4 var(--body);
        -webkit-font-smoothing: antialiased;
      }
      .a *,
      .phone * {
        min-width: 0;
      }
      .a svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .top {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        height: 52px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 600 15px var(--head);
        white-space: nowrap;
      }
      .logo {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--accent);
        color: var(--on);
        display: grid;
        place-items: center;
      }
      .logo svg {
        width: 15px;
        height: 15px;
      }
      .apps {
        display: flex;
        gap: 2px;
      }
      .apps span {
        padding: 6px 11px;
        border-radius: var(--r);
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .apps .on {
        color: var(--text);
        background: var(--sel);
        font-weight: 500;
      }
      .search {
        flex: 1;
        max-width: 460px;
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        height: 34px;
        padding: 0 11px;
        border-radius: var(--r);
        background: var(--field);
        color: var(--muted);
      }
      .kbd {
        font: 500 11px var(--mono);
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--muted);
        background: var(--surface);
      }
      .me {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--c3);
        color: #fff;
        display: grid;
        place-items: center;
        font: 600 12px var(--body);
      }
      .side {
        grid-area: side;
        padding: 12px 10px;
        background: var(--side);
        overflow: hidden;
      }
      .side h6 {
        font: 600 11px var(--body);
        color: var(--muted);
        margin: 14px 10px 4px;
        letter-spacing: 0.02em;
      }
      .nav {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 6px 10px;
        border-radius: var(--r);
        color: var(--text);
        white-space: nowrap;
      }
      .nav b {
        margin-left: auto;
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
      }
      .nav.on {
        background: var(--sel);
        font-weight: 600;
      }
      .nav.on b {
        color: var(--text);
      }
      .nav i {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        margin: 0 3px;
        flex: none;
      }
      .cta {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        background: var(--accent);
        color: var(--on);
        border-radius: var(--r);
        font-weight: 600;
        margin: 0 0 10px;
        white-space: nowrap;
      }
      .main {
        grid-area: main;
        display: flex;
        overflow: hidden;
        background: var(--surface);
      }
      .list {
        width: 370px;
        flex: none;
        border-right: 1px solid var(--line);
        overflow: hidden;
      }
      .lh {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 14px 16px 10px;
      }
      .lh h2 {
        margin: 0;
        font: 600 21px var(--head);
      }
      .lh span {
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .row.on {
        background: var(--sel);
      }
      .av {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        color: #fff;
        font: 600 12px var(--body);
      }
      .rb {
        flex: 1;
      }
      .r1 {
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }
      .who {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .t {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .sub {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sn {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .u .who,
      .u .sub {
        font-weight: 600;
      }
      .dot {
        display: none;
      }
      .tag {
        display: inline-block;
        padding: 0 7px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 500;
        line-height: 18px;
        background: color-mix(in srgb, var(--tc) 16%, transparent);
        color: var(--tt);
      }
      .read {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 28px;
        position: relative;
        overflow: hidden;
      }
      .read h1 {
        font: 600 22px/1.25 var(--head);
        margin: 0 0 8px;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0 14px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
      }
      .meta small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .body {
        font: var(--readfont);
        max-width: 600px;
      }
      .body p {
        margin: 0 0 11px;
      }
      .att {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        margin-bottom: 12px;
      }
      .att small {
        color: var(--muted);
      }
      .reply {
        margin-top: auto;
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 11px 13px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .send {
        background: var(--accent);
        color: var(--on);
        padding: 5px 13px;
        border-radius: var(--r);
        font-weight: 600;
      }
      .toast {
        position: absolute;
        left: 28px;
        bottom: 78px;
        display: flex;
        gap: 14px;
        background: var(--text);
        color: var(--bg);
        padding: 8px 14px;
        border-radius: var(--r);
        font-size: 13px;
      }
      .toast b {
        font-weight: 600;
      }
      .cal {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 14px 18px;
        overflow: hidden;
      }
      .ch {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding-bottom: 10px;
      }
      .ch h2 {
        margin: 0;
        font: 600 21px var(--head);
      }
      .ch span {
        color: var(--muted);
      }
      .days {
        display: grid;
        grid-template-columns: 50px repeat(5, 1fr);
        flex: none;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        padding-bottom: 7px;
      }
      .days .now {
        color: var(--accent);
        font-weight: 600;
      }
      .wk {
        position: relative;
        flex: 1;
      }
      .hr {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        padding-left: 4px;
      }
      .ev {
        position: absolute;
        padding: 4px 8px;
        border-radius: calc(var(--r) * 0.7);
        font-size: 12px;
        line-height: 1.3;
        font-weight: 500;
        background: color-mix(in srgb, var(--tc) 18%, var(--surface));
        color: var(--tt);
        border-left: 3px solid var(--tc);
        overflow: hidden;
      }
      .ev small {
        display: block;
        font-weight: 400;
        font-size: 11px;
      }
      .nowl {
        position: absolute;
        height: 2px;
        background: var(--accent);
      }
      .files {
        flex: 1;
        padding: 14px 20px;
        overflow: hidden;
      }
      .crumb {
        color: var(--muted);
        margin-bottom: 4px;
      }
      .files h2 {
        margin: 0 0 12px;
        font: 600 21px var(--head);
      }
      .recent {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .card small {
        display: block;
        color: var(--muted);
      }
      .tb {
        display: grid;
        grid-template-columns: 1fr 130px 110px 80px;
        padding: 9px 8px;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .tb.h {
        font-size: 12px;
        color: var(--muted);
        border-top: 0;
      }
      .tb span:first-child {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .tb span:not(:first-child) {
        color: var(--muted);
        font-size: 13px;
      }
      .tb svg {
        color: var(--accent);
      }
      .quota {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .bar {
        height: 6px;
        border-radius: 9px;
        background: var(--line);
        margin-top: 5px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 34%;
        background: var(--accent);
      }
      .sign {
        height: 100%;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.4 var(--body);
      }
      .box {
        width: 380px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: calc(var(--r) * 1.6);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .box .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }
      .box .logo svg {
        width: 21px;
        height: 21px;
      }
      .box h1 {
        margin: 6px 0 0;
        font: 600 24px var(--head);
      }
      .box p {
        margin: 0;
        color: var(--muted);
      }
      .inp {
        height: 42px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 0 12px;
        display: flex;
        align-items: center;
        background: var(--bg);
      }
      .box .cta {
        margin: 0;
        padding: 11px;
      }
      .lnk {
        color: var(--link);
        text-align: center;
        font-weight: 500;
      }
      .box svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ph {
        height: 100%;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--text) 12%, var(--bg));
      }
      .phone {
        width: 330px;
        height: 668px;
        border-radius: 38px;
        border: 7px solid #111;
        overflow: hidden;
        background: var(--surface);
        color: var(--text);
        font: 400 14px/1.4 var(--body);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .phone svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .phone .lh {
        padding-top: 26px;
      }
      .phone .rows {
        flex: 1;
        overflow: hidden;
      }
      .tabs {
        display: flex;
        justify-content: space-around;
        padding: 9px 0 15px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        background: var(--side);
      }
      .tabs span {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .tabs .on {
        color: var(--link);
        font-weight: 600;
      }
      .fab {
        position: absolute;
        right: 16px;
        bottom: 78px;
        width: 50px;
        height: 50px;
        border-radius: var(--fab);
        background: var(--accent);
        color: var(--on);
        display: grid;
        place-items: center;
      }
      .pal {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.4 var(--body);
        padding: 24px 28px;
        overflow: hidden;
      }
      .pal h2 {
        margin: 0;
        font: 600 28px var(--head);
      }
      .pal > p {
        color: var(--muted);
        margin: 3px 0 14px;
      }
      .sw {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
        margin-bottom: 16px;
      }
      .sw div {
        font-size: 11px;
      }
      .sw i {
        display: block;
        height: 150px;
        border-radius: var(--r);
        border: 1px solid var(--line);
        margin-bottom: 5px;
      }
      .sw code {
        font: 400 11px var(--mono);
        color: var(--muted);
      }
      .samples {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 18px;
      }
      .samples h3 {
        font: 600 12px var(--body);
        color: var(--muted);
        margin: 0 0 7px;
      }
      .bt {
        display: inline-block;
        padding: 7px 14px;
        border-radius: var(--r);
        margin: 0 5px 7px 0;
        font-weight: 600;
        border: 1px solid var(--line);
      }
      .bt.p {
        background: var(--accent);
        color: var(--on);
        border-color: transparent;
      }
      .cr {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        padding: 2px 0;
        border-bottom: 1px solid var(--line);
      }
      .cr b {
        font: 500 12px var(--mono);
      }

      [data-d="daylight"] .a {
        grid-template: "side top" 52px "side main" 1fr/216px 1fr;
      }
      [data-d="daylight"] .top .brand,
      [data-d="daylight"] .top .apps {
        display: none;
      }
      [data-d="daylight"] .top {
        background: var(--surface);
      }
      [data-d="daylight"] .search {
        margin-left: 0;
      }
      [data-d="daylight"] .me {
        margin-left: auto;
      }
      [data-d="daylight"] .row {
        border-top: 0;
        margin: 0 8px;
        padding: 9px 10px;
        border-radius: 10px;
      }
      [data-d="daylight"] .side {
        border-right: 1px solid var(--line);
      }
      [data-d="daylight"] .sideapps {
        display: block;
      }

      [data-d="paper"] .a {
        grid-template: "top" 58px "side" 42px "main" 1fr/1fr;
      }
      [data-d="paper"] .side {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      [data-d="paper"] .side h6 {
        display: none;
      }
      [data-d="paper"] .side .cta {
        order: 9;
        margin: 0 0 0 auto;
        padding: 4px 14px;
      }
      [data-d="paper"] .side .cta svg {
        display: none;
      }
      [data-d="paper"] .phone .lh {
        display: flex;
      }
      [data-d="paper"] .nav {
        padding: 4px 10px;
        border-radius: 0;
      }
      [data-d="paper"] .nav svg {
        display: none;
      }
      [data-d="paper"] .nav.on {
        background: none;
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      [data-d="paper"] .nav b {
        margin-left: 5px;
      }
      [data-d="paper"] .apps .on {
        background: none;
        box-shadow: inset 0 -2px 0 var(--text);
        border-radius: 0;
      }
      [data-d="paper"] .apps svg,
      [data-d="paper"] .av,
      [data-d="paper"] .logo {
        display: none;
      }
      [data-d="paper"] .brand {
        font-size: 21px;
        font-weight: 500;
      }
      [data-d="paper"] .search {
        background: transparent;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        max-width: 290px;
      }
      [data-d="paper"] .sub {
        font: 500 16px/1.3 var(--head);
      }
      [data-d="paper"] .u .sub {
        font-weight: 600;
      }
      [data-d="paper"] .row {
        padding: 12px 20px;
      }
      [data-d="paper"] .lh {
        display: none;
      }
      [data-d="paper"] .row:first-child {
        border-top: 0;
      }
      [data-d="paper"] .read {
        padding: 26px 48px;
      }
      [data-d="paper"] .read h1 {
        font-size: 31px;
        font-weight: 500;
      }
      [data-d="paper"] .list {
        width: 400px;
      }
      [data-d="paper"] .tag {
        background: none;
        padding: 0;
        font-style: italic;
      }
      [data-d="paper"] .toast {
        left: 48px;
      }
      [data-d="graphite"] .toast {
        left: 24px;
      }
      [data-d="graphite"] .phone .rb {
        display: block;
      }
      [data-d="graphite"] .phone .r1 {
        width: auto;
      }
      [data-d="graphite"] .phone .r1 .t {
        display: inline;
        font: 400 11px var(--mono);
      }
      [data-d="graphite"] .phone .tt {
        display: none !important;
      }
      [data-d="graphite"] .phone .row {
        align-items: flex-start;
        padding: 9px 14px;
      }
      [data-d="graphite"] .phone .dot {
        margin-top: 7px;
      }
      [data-d="paper"] .box {
        border: 0;
        background: none;
      }
      [data-d="paper"] .box .logo {
        display: none;
      }
      [data-d="paper"] .box h1 {
        font-size: 36px;
        font-weight: 500;
      }
      [data-d="paper"] .phone .av {
        display: none;
      }

      [data-d="cirrus"] .a {
        grid-template: "top top" 58px "side main" 1fr/216px 1fr;
      }
      [data-d="cirrus"] .top {
        border: 0;
      }
      [data-d="cirrus"] .search {
        background: var(--surface);
        border-radius: 99px;
        height: 38px;
      }
      [data-d="cirrus"] .apps span {
        border-radius: 99px;
      }
      [data-d="cirrus"] .main {
        margin: 0 12px 12px 0;
        border-radius: 20px;
        box-shadow: 0 1px 3px rgba(20, 50, 90, 0.1);
      }
      [data-d="cirrus"] .cta {
        border-radius: 16px;
        padding: 12px;
        justify-content: flex-start;
      }
      [data-d="cirrus"] .nav {
        border-radius: 99px;
      }
      [data-d="cirrus"] .row {
        border-top: 0;
        margin: 0 8px;
        border-radius: 14px;
      }
      [data-d="cirrus"] .av {
        border-radius: 12px;
      }
      [data-d="cirrus"] .apps .on {
        background: var(--surface);
      }

      const vars = (d, m) => {
        const x = D[d],
          p = x[m];
        return (
          Object.entries(p)
            .map(([k, v]) => `--${k}:${v}`)
            .join(";") +
          `;--link:${p.accent};--body:${x.body};--head:${x.head};--readfont:${x.read};--mono:'Geist Mono',ui-monospace,monospace;--r:${x.r};--fab:${x.fab}`
        );
      };
      const frame = (d, m, s) =>
        `<div class="stage"><div class="frame" data-d="${d}" style="${vars(d, m)}">${s == "palette" ? palette(d, m) : SCREENS[s][1]()}</div></div>`;
      const h = new URLSearchParams(location.hash.slice(1));
      const S = {
        d: h.get("d") || "compare",
        s: h.get("s") || "mail",
        m: h.get("m") || "light",
      };
      const fit = () =>
        document.querySelectorAll(".stage").forEach((e) => {
          e.firstChild.style.transform = `scale(${e.clientWidth / 1120})`;
        });
      function draw() {
        const b = (k, v, l) =>
          `<button class="${S[k] == v ? "on" : ""}" onclick="S.${k}='${v}';draw()">${l}</button>`;
        ctl.innerHTML = `<div>${b("d", "compare", "Compare all")}${Object.keys(
          D,
        )
          .map((k) => b("d", k, D[k].name))
          .join("")}</div><div>${Object.keys(SCREENS)
          .map((k) => b("s", k, SCREENS[k][0]))
          .join(
            "",
          )}</div><div>${b("m", "light", "Light")}${b("m", "dark", "Dark")}</div>`;
        note.textContent =
          S.d == "compare"
            ? "Same content, four directions. Click a tile to open it."
            : D[S.d].feel;
        view.innerHTML =
          S.d == "compare"
            ? `<div class="grid two">${Object.keys(D)
                .map(
                  (k) =>
                    `<div class="tile" onclick="S.d='${k}';draw()"><p>${D[k].name}</p>${frame(k, S.m, S.s)}</div>`,
                )
                .join("")}</div>`
            : frame(S.d, S.m, S.s);
        fit();
      }
      const ctl = document.getElementById("ctl"),
        note = document.getElementById("note"),
        view = document.getElementById("view");
      window.S = S;
      window.draw = draw;
      window.__contrast = () =>
        Object.entries(D).flatMap(([d, x]) =>
          ["light", "dark"].flatMap((m) =>
            PAIRS.map(([l, a, b]) => ({
              d,
              m,
              l,
              v: +cr(x[m][a], x[m][b]).toFixed(2),
            })),
          ),
        );
      new ResizeObserver(fit).observe(view);
      draw();
    </script>
  </body>
</html>
